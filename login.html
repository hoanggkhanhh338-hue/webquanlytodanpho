<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Hệ Thống Quản Lý Dân Cư Tổ Dân Phố Số 5</title>
  <meta name="description" content="Cổng thông tin đăng nhập dành cho Ban quản lý và Cán bộ Tổ dân phố số 5.">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <!-- Header banner -->
    <div class="bg-gradient-to-r from-blue-800 to-indigo-900 p-6 text-center text-white relative">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 mb-3 shadow-inner">
        <i class="fa-solid fa-landmark-flag text-2xl text-yellow-300"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight uppercase">Tổ Dân Phố Số 5</h1>
      <p class="text-xs text-blue-200 mt-1">Phường Dịch Vọng Hậu · Quận Cầu Giấy · TP. Hà Nội</p>
      <div class="mt-3 inline-block px-3 py-1 bg-yellow-400/20 text-yellow-300 text-xs font-semibold rounded-full border border-yellow-400/30">
        <i class="fa-solid fa-shield-halved mr-1"></i> Cổng Điều Hành Dân Cư Điện Tử
      </div>
    </div>

    <!-- Login form -->
    <div class="p-6 md:p-8">
      <div class="mb-5 text-center">
        <h2 class="text-lg font-bold text-slate-800">Đăng Nhập Cán Bộ Quản Lý</h2>
        <p class="text-xs text-slate-500 mt-0.5">Nhập tài khoản được phân quyền để truy cập hệ thống</p>
      </div>

      <!-- Alert box -->
      <div id="login-alert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium flex items-center gap-2"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" for="email">
            Tài khoản / Email công vụ
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required
              placeholder="admin@todanpho5.gov.vn" 
              value="admin@todanpho5.gov.vn"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"
            >
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" for="password">
            Mật khẩu bảo mật
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              placeholder="••••••••" 
              value="123"
              class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"
            >
            <button 
              type="button" 
              id="toggle-password" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
            >
              <i class="fa-solid fa-eye" id="password-icon"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center text-slate-600 select-none cursor-pointer">
            <input type="checkbox" id="remember-me" checked class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
            <span class="ml-2">Ghi nhớ đăng nhập</span>
          </label>
          <a href="#" onclick="alert('Vui lòng liên hệ UBND Phường Dịch Vọng Hậu hoặc Bộ phận CNTT quận để cấp lại mã xác thực.'); return false;" class="text-blue-600 hover:underline">
            Quên mật khẩu?
          </a>
        </div>

        <button 
          type="submit" 
          id="submit-btn" 
          class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-700 to-indigo-700 hover:from-blue-800 hover:to-indigo-800 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Đăng Nhập Vào Hệ Thống</span>
        </button>
      </form>

      <!-- Quick demo accounts -->
      <div class="mt-6 pt-5 border-t border-slate-200">
        <p class="text-xs font-semibold text-slate-500 text-center mb-3">
          <i class="fa-solid fa-bolt text-amber-500 mr-1"></i> TÀI KHOẢN MẪU ĐỂ XEM NHANH:
        </p>
        <div class="grid grid-cols-1 gap-2">
          <button 
            type="button"
            onclick="fillAccount('admin@todanpho5.gov.vn', '123')"
            class="flex items-center justify-between px-3 py-2 text-xs bg-slate-50 hover:bg-blue-50 hover:border-blue-300 border border-slate-200 rounded-lg text-slate-700 transition"
          >
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-[11px]">H</span>
              <span class="font-medium text-slate-900">Bác Nguyễn Văn Hưng</span>
            </div>
            <span class="text-blue-600 font-semibold bg-blue-50 px-2 py-0.5 rounded border border-blue-100">Tổ trưởng</span>
          </button>

          <button 
            type="button"
            onclick="fillAccount('phophuong@todanpho5.gov.vn', '123')"
            class="flex items-center justify-between px-3 py-2 text-xs bg-slate-50 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 rounded-lg text-slate-700 transition"
          >
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-[11px]">L</span>
              <span class="font-medium text-slate-900">Cô Trần Thị Mai Lan</span>
            </div>
            <span class="text-emerald-600 font-semibold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">Tổ phó</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="bg-slate-50 py-3 px-6 text-center text-xs text-slate-500 border-t border-slate-200">
      Bản quyền © 2026 Ban Quản Lý Tổ Dân Phố Số 5 · VNeID liên thông
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/services/hoKhauService.js"></script>
  <script src="js/services/nhanKhauService.js"></script>
  <script src="js/services/thuPhiService.js"></script>
  <script src="js/services/phanAnhService.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Điền tài khoản nhanh
    function fillAccount(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      const alertBox = document.getElementById('login-alert');
      alertBox.className = "mb-4 p-3 rounded-lg text-xs font-medium flex items-center gap-2 bg-blue-50 text-blue-800 border border-blue-200";
      alertBox.innerHTML = `<i class="fa-solid fa-circle-check text-blue-600"></i> Đã nạp thông tin tài khoản mẫu: <b>${email}</b>. Bấm Đăng nhập để tiếp tục.`;
      alertBox.classList.remove('hidden');
    }

    // Toggle ẩn/hiện mật khẩu
    const togglePassBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const passwordIcon = document.getElementById('password-icon');

    togglePassBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      passwordIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    // Xử lý gửi form đăng nhập
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember-me').checked;
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang xác thực...`;

      setTimeout(() => {
        const result = authService.login(email, password, remember);

        if (result.success) {
          alertBox.className = "mb-4 p-3 rounded-lg text-xs font-medium flex items-center gap-2 bg-emerald-50 text-emerald-800 border border-emerald-200";
          alertBox.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i> Xin chào đồng chí <b>${result.user.name}</b>! Đang chuyển hướng vào hệ thống...`;
          alertBox.classList.remove('hidden');

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        } else {
          alertBox.className = "mb-4 p-3 rounded-lg text-xs font-medium flex items-center gap-2 bg-rose-50 text-rose-800 border border-rose-200";
          alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-600"></i> ${result.message}`;
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>Đăng Nhập Vào Hệ Thống</span>`;
        }
      }, 300);
    });
  </script>
</body>
</html>
